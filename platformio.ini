; PlatformIO Configuration for ESP32 + 74HC595 + MQTT

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

; Serial Monitor
monitor_speed = 115200
monitor_filters = time

; Dependencies
lib_deps =
    pubsubclient@2.8
    bblanchon/ArduinoJson@6.19.4

; Optimization
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=1

; Optional: upload_speed
upload_speed = 921600
